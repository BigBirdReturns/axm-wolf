name: clinical-site-operator-pack-bootstrap

on:
  push:
    branches:
      - feature/clinical-site-operators-deposition
    paths:
      - ".github/import-clinical-site-operator-v2/bootstrap.retry"

permissions:
  contents: write

jobs:
  materialize-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clinical-site-operators-deposition
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reconstruct reviewed pack overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import-clinical-site-operator-v2/part-* > /tmp/clinical-site-operator-overlay.tar.gz.b64
          base64 --decode /tmp/clinical-site-operator-overlay.tar.gz.b64 > /tmp/clinical-site-operator-overlay.tar.gz
          echo "e894633fd35c4380bc435ef5196f6a278f8b13bc8d3b09cfe424877ebda5a199  /tmp/clinical-site-operator-overlay.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/clinical-site-operator-overlay.tar.gz -C .

      - name: Apply reviewed type-safe test fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/packs/clinical-site-operators-deposition.test.ts')
          text = path.read_text()
          old = "prompt.tags.includes('portable-challenge')"
          new = "(prompt.tags ?? []).includes('portable-challenge')"
          if old not in text:
              raise SystemExit('expected test expression not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Required Wolf quality gate
        run: npm run check

      - name: Static e2e smoke
        run: npm run test:e2e

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit qualified pack and remove bootstrap staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "axm-wolf-pack-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add src/packs/clinical-site-operators-deposition
          git add src/app/lib/examplePacks.ts
          git add tests/packs/clinical-site-operators-deposition.test.ts
          git rm -r .github/import-clinical-site-operator .github/import-clinical-site-operator-v2
          git rm .github/workflows/clinical-site-operator-bootstrap.yml
          git commit -m "wolf: add clinical site operator deposition pack"
          git push origin HEAD:feature/clinical-site-operators-deposition
